<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Set Water Limit | WaterPlanner</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">
</head>

<body>

    <nav>
        <div class="logo">💧 WaterPlanner</div>

        <div>
            <a href="/">Home</a>
            <a href="/dashboard">Dashboard</a>
            <a href="/logout">Logout</a>
        </div>
    </nav>


    <section class="auth-section">

        <div class="auth-card">

            <div class="auth-icon">🎯</div>

            <h1>Set Daily Water Limit</h1>

            <p class="auth-subtitle">
                Set your daily water consumption goal
            </p>


            <form method="POST">

                <div class="form-group">

                    <label>Daily Water Limit (Liters)</label>

                    <input
                        type="number"
                        name="daily_limit"
                        placeholder="Example: 150"
                        min="1"
                        step="0.1"
                        value="{{ daily_limit }}"
                        required
                    >

                </div>


                <button type="submit" class="auth-btn">
                    Save Limit →
                </button>

            </form>


            <p class="auth-footer">

                <a href="/dashboard">
                    ← Back to Dashboard
                </a>

            </p>

        </div>

    </section>

</body>

</html>
